[package]
name = "termxboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = "0.39.6"
battery = "0.7.8"
ureq = "3.3.0"
urlencoding = "2.1.3"

[[bin]]
name = "TermXBoard"
path = "src/main.rs"
